name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  companion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Offline health
        run: node companion/src/index.mjs --check
      - name: Protocol tests
        run: npm --prefix companion test
  addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Syntax validation
        run: luac5.1 -p addon/RischlabWoWCompanion/Core.lua tests/addon_smoke.lua
      - name: Addon smoke test
        run: lua5.1 tests/addon_smoke.lua
